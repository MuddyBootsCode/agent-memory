[project]
name = "neo4j-agent-memory-mcp"
version = "0.1.0"
description = "Standalone MCP server for Neo4j Agent Memory"
requires-python = ">=3.10"
dependencies = [
    "neo4j-agent-memory[mcp,openai]",
    "fastmcp>=2.0.0,<3",
    "baml-py>=0.70.0",
]

[project.scripts]
neo4j-memory-mcp = "neo4j_agent_memory.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo4j_agent_memory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
